name: BrightShip Staging Deployment

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dreyshantel

jobs:

  # ============================================================
  # 1. DETERMINE SQUAD
  # ============================================================
  branch-validation:
    name: Determine Squad
    runs-on: ubuntu-latest

    outputs:
      squad: ${{ steps.detect-squad.outputs.squad }}
      stack: ${{ steps.detect-squad.outputs.stack }}

    steps:
      - name: Determine target squad
        id: detect-squad
        shell: bash
        env:
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Pull Request merged: $PR_MERGED"
          echo "Source branch: $PR_HEAD_REF"
          echo "Target branch: ${{ github.event.pull_request.base.ref }}"

          if [[ "$PR_MERGED" != "true" ]]; then
            echo "Pull request was closed without being merged."
            echo "No deployment will occur."
            exit 0
          fi

          if [[ "$PR_HEAD_REF" == squad-alpha/* ]]; then
            SQUAD="alpha"
            STACK="brightship-alpha"

          elif [[ "$PR_HEAD_REF" == squad-beta/* ]]; then
            SQUAD="beta"
            STACK="brightship-beta"

          elif [[ "$PR_HEAD_REF" == squad-gamma/* ]]; then
            SQUAD="gamma"
            STACK="brightship-gamma"

          elif [[ "$PR_HEAD_REF" == squad-delta/* ]]; then
            SQUAD="delta"
            STACK="brightship-delta"

          else
            echo "::error::Merged PR must originate from a valid squad branch."
            echo "::error::Expected:"
            echo "::error::squad-alpha/*"
            echo "::error::squad-beta/*"
            echo "::error::squad-gamma/*"
            echo "::error::squad-delta/*"
            exit 1
          fi

          echo "Detected squad: $SQUAD"
          echo "Target Portainer stack: $STACK"

          echo "squad=$SQUAD" >> "$GITHUB_OUTPUT"
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. CI GATE
  # ============================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - branch-validation

    if: github.event.pull_request.merged == true

    services:

      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432

        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: brightship_test

        options: >-
          --health-cmd "pg_isready -U admin -d brightship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: brightship_test
      DB_USER: admin
      DB_PASSWORD: testpassword
      DB_SSL: false

      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:

      - name: Checkout merged code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            brightship/services/api/package-lock.json
            brightship/services/jobs/package-lock.json
            brightship/services/notify/package-lock.json

      # --------------------------------------------------------
      # Secret scanning
      # --------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install API dependencies
        working-directory: brightship/services/api
        run: npm ci

      - name: Install Jobs dependencies
        working-directory: brightship/services/jobs
        run: npm ci

      - name: Install Notify dependencies
        working-directory: brightship/services/notify
        run: npm ci

      # --------------------------------------------------------
      # Initialize test database
      # --------------------------------------------------------
      - name: Initialize test database
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -f brightship/database/schema.sql

      # --------------------------------------------------------
      # Application tests
      # --------------------------------------------------------
      - name: Run API tests
        working-directory: brightship/services/api
        run: npm test

      - name: Run Jobs tests
        working-directory: brightship/services/jobs
        run: npm test

      - name: Run Notify tests
        working-directory: brightship/services/notify
        run: npm test

      # --------------------------------------------------------
      # Dependency security
      # --------------------------------------------------------
      - name: Run npm audit - API
        working-directory: brightship/services/api
        run: npm audit --audit-level=high

      - name: Run npm audit - Jobs
        working-directory: brightship/services/jobs
        run: npm audit --audit-level=high

      - name: Run npm audit - Notify
        working-directory: brightship/services/notify
        run: npm audit --audit-level=high


  # ============================================================
  # 3. DOCKER BUILD + TRIVY SECURITY SCAN
  # ============================================================
  docker-security:
    name: Docker Build & Trivy
    runs-on: ubuntu-latest

    needs:
      - branch-validation
      - ci-gate

    if: github.event.pull_request.merged == true

    steps:

      - name: Checkout merged code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # API
      # --------------------------------------------------------
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./brightship/services/api
          file: ./brightship/services/api/Dockerfile
          push: false
          load: true
          tags: brightship-api:${{ github.sha }}

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: brightship-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------------------------
      # JOBS
      # --------------------------------------------------------
      - name: Build Jobs image
        uses: docker/build-push-action@v6
        with:
          context: ./brightship/services/jobs
          file: ./brightship/services/jobs/Dockerfile
          push: false
          load: true
          tags: brightship-jobs:${{ github.sha }}

      - name: Scan Jobs image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: brightship-jobs:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # --------------------------------------------------------
      # NOTIFY
      # --------------------------------------------------------
      - name: Build Notify image
        uses: docker/build-push-action@v6
        with:
          context: ./brightship/services/notify
          file: ./brightship/services/notify/Dockerfile
          push: false
          load: true
          tags: brightship-notify:${{ github.sha }}

      - name: Scan Notify image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: brightship-notify:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # ============================================================
  # 4. PUBLISH IMAGES TO GHCR
  # ============================================================
  publish-images:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest

    needs:
      - branch-validation
      - ci-gate
      - docker-security

    if: github.event.pull_request.merged == true

    steps:

      - name: Checkout merged code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # API
      # --------------------------------------------------------
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./brightship/services/api
          file: ./brightship/services/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/brightship-api:${{ needs.branch-validation.outputs.squad }}-staging
            ghcr.io/${{ env.IMAGE_OWNER }}/brightship-api:${{ github.sha }}

      # --------------------------------------------------------
      # JOBS
      # --------------------------------------------------------
      - name: Build and push Jobs
        uses: docker/build-push-action@v6
        with:
          context: ./brightship/services/jobs
          file: ./brightship/services/jobs/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/brightship-jobs:${{ needs.branch-validation.outputs.squad }}-staging
            ghcr.io/${{ env.IMAGE_OWNER }}/brightship-jobs:${{ github.sha }}

      # --------------------------------------------------------
      # NOTIFY
      # --------------------------------------------------------
      - name: Build and push Notify
        uses: docker/build-push-action@v6
        with:
          context: ./brightship/services/notify
          file: ./brightship/services/notify/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/brightship-notify:${{ needs.branch-validation.outputs.squad }}-staging
            ghcr.io/${{ env.IMAGE_OWNER }}/brightship-notify:${{ github.sha }}


  # ============================================================
  # 5. DEPLOY TO PORTAINER
  # ============================================================
  deploy-staging:
    name: Deploy to Portainer
    runs-on: ubuntu-latest

    needs:
      - branch-validation
      - ci-gate
      - docker-security
      - publish-images

    if: github.event.pull_request.merged == true

    steps:

      - name: Select Portainer stack
        id: stack
        env:
          SQUAD: ${{ needs.branch-validation.outputs.squad }}
        run: |
          case "$SQUAD" in
            alpha)
              STACK_NAME="brightship-alpha"
              COMPOSE_FILE="brightship/staging/alpha/docker-compose.yml"
              ;;
            beta)
              STACK_NAME="brightship-beta"
              COMPOSE_FILE="brightship/staging/beta/docker-compose.yml"
              ;;
            gamma)
              STACK_NAME="brightship-gamma"
              COMPOSE_FILE="brightship/staging/gamma/docker-compose.yml"
              ;;
            delta)
              STACK_NAME="brightship-delta"
              COMPOSE_FILE="brightship/staging/delta/docker-compose.yml"
              ;;
            *)
              echo "::error::Unknown squad: $SQUAD"
              exit 1
              ;;
          esac

          echo "stack_name=$STACK_NAME" >> "$GITHUB_OUTPUT"
          echo "compose_file=$COMPOSE_FILE" >> "$GITHUB_OUTPUT"

      - name: Get Portainer endpoint
        id: endpoint
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          ENDPOINT_ID=$(curl -sf \
            "${PORTAINER_URL}/api/endpoints" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" |
            jq -r '.[0].Id')

          if [[ -z "$ENDPOINT_ID" || "$ENDPOINT_ID" == "null" ]]; then
            echo "::error::Could not determine Portainer endpoint ID."
            exit 1
          fi

          echo "endpoint_id=$ENDPOINT_ID" >> "$GITHUB_OUTPUT"

      - name: Check Portainer stack
        id: existing-stack
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_NAME: ${{ steps.stack.outputs.stack_name }}
        run: |
          STACK_ID=$(curl -sf \
            "${PORTAINER_URL}/api/stacks" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" |
            jq -r --arg STACK_NAME "$STACK_NAME" \
            '.[] | select(.Name == $STACK_NAME) | .Id' |
            head -n 1)

          if [[ -n "$STACK_ID" && "$STACK_ID" != "null" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "stack_id=$STACK_ID" >> "$GITHUB_OUTPUT"
            echo "Stack exists: $STACK_NAME (ID: $STACK_ID)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Stack does not exist: $STACK_NAME"
          fi

      - name: Create Portainer stack
        if: steps.existing-stack.outputs.exists == 'false'
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          ENDPOINT_ID: ${{ steps.endpoint.outputs.endpoint_id }}
          STACK_NAME: ${{ steps.stack.outputs.stack_name }}
          COMPOSE_FILE: ${{ steps.stack.outputs.compose_file }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          curl -sf -X POST \
            "${PORTAINER_URL}/api/stacks/create/standalone/repository?endpointId=${ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @- <<EOF
          {
            "Name": "${STACK_NAME}",
            "RepositoryURL": "https://github.com/Dreyshantel/brightship-tracker.git",
            "RepositoryReferenceName": "refs/heads/develop",
            "ComposeFile": "${COMPOSE_FILE}",
            "RepositoryAuthentication": false,
            "Env": [
              {
                "name": "DB_PASSWORD",
                "value": "${DB_PASSWORD}"
              }
            ]
          }
          EOF

      - name: Redeploy Portainer stack
        if: steps.existing-stack.outputs.exists == 'true'
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          ENDPOINT_ID: ${{ steps.endpoint.outputs.endpoint_id }}
          STACK_ID: ${{ steps.existing-stack.outputs.stack_id }}
        run: |
          curl -sf -X PUT \
            "${PORTAINER_URL}/api/stacks/${STACK_ID}/git/redeploy?endpointId=${ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            --data '{
              "RepullImageAndRedeploy": true,
              "Prune": false
            }'

      - name: Deployment summary
        run: |
          echo "Staging deployment successful"
          echo "Squad: ${{ needs.branch-validation.outputs.squad }}"
          echo "Stack: ${{ steps.stack.outputs.stack_name }}"
          echo "Commit: ${{ github.event.pull_request.merge_commit_sha }}"



name: BrightShip Production Deployment

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dreyshantel

  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0fdce62ef49bc9fa4
  IAM_ROLE_ARN: arn:aws:iam::928118644342:role/BrightShip-GitHub-Production-Deploy

  COMPOSE_PATH: /opt/brightship/compose-production.yml
  SECRETS_ID: rds!db-97b7c300-82ae-4e9c-ae7d-9f81383cad2d

jobs:

  # ============================================================
  # 1. VALIDATE MERGED PR
  # ============================================================
  validate:
    name: Validate Production Deployment
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate branch
        run: |
          echo "Production deployment triggered by merged PR."
          echo "Source branch: ${{ github.event.pull_request.head.ref }}"
          echo "Target branch: ${{ github.event.pull_request.base.ref }}"
          echo "Commit: ${{ github.sha }}"

  # ============================================================
  # 2. CI GATE
  # ============================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs: validate

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brightship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d brightship_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: true
      matrix:
        service:
          - api
          - jobs
          - notify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Gitleaks
      # --------------------------------------------------------
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: brightship/services/${{ matrix.service }}/package-lock.json

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: brightship/services/${{ matrix.service }}
        run: npm ci

      # --------------------------------------------------------
      # Tests
      # --------------------------------------------------------
      - name: Run tests
        working-directory: brightship/services/${{ matrix.service }}
        env:
          NODE_ENV: test

          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: brightship_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSL: false

          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      # --------------------------------------------------------
      # Dependency audit
      # --------------------------------------------------------
      - name: Run npm audit
        working-directory: brightship/services/${{ matrix.service }}
        run: npm audit --audit-level=high

  # ============================================================
  # 3. DOCKER SECURITY
  # ============================================================
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest

    needs: ci-gate

    strategy:
      fail-fast: true
      matrix:
        service:
          - api
          - jobs
          - notify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: brightship
        run: |
          docker build \
            -t brightship-${{ matrix.service }}:${{ github.sha }} \
            services/${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: brightship-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  # ============================================================
  # 4. PUBLISH IMAGES TO GHCR
  # ============================================================
  publish-images:
    name: Publish Production Images
    runs-on: ubuntu-latest

    needs: docker-security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # API
      # --------------------------------------------------------
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: brightship/services/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-api:production

      # --------------------------------------------------------
      # Jobs
      # --------------------------------------------------------
      - name: Build and push Jobs
        uses: docker/build-push-action@v6
        with:
          context: brightship/services/jobs
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-jobs:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-jobs:production

      # --------------------------------------------------------
      # Notify
      # --------------------------------------------------------
      - name: Build and push Notify
        uses: docker/build-push-action@v6
        with:
          context: brightship/services/notify
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-notify:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-notify:production

  # ============================================================
  # 5. DEPLOY TO PRODUCTION
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs:
      - validate
      - publish-images

    environment: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Encode production Compose file
      # --------------------------------------------------------
      - name: Encode production compose file
        id: compose
        run: |
          COMPOSE_B64=$(base64 -w 0 brightship/compose-production.yml)
          echo "compose_b64=$COMPOSE_B64" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Deploy through SSM
      # --------------------------------------------------------
      - name: Deploy via AWS SSM
        id: deploy
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "BrightShip production deployment ${{ github.sha }}" \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /opt/brightship\",
              \"echo '${{ steps.compose.outputs.compose_b64 }}' | base64 -d > '${{ env.COMPOSE_PATH }}'\",
              \"cd /opt/brightship\",
              \"export IMAGE_TAG='${{ github.sha }}'\",
              \"SECRET_JSON=\\$(aws secretsmanager get-secret-value --secret-id '${{ env.SECRETS_ID }}' --query SecretString --output text)\",
              \"export DB_HOST=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.host // .DB_HOST')\",
              \"export DB_PORT=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.port // .DB_PORT // 5432')\",
              \"export DB_NAME=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.dbname // .DB_NAME')\",
              \"export DB_USER=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.username // .DB_USER')\",
              \"export DB_PASSWORD=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.password // .DB_PASSWORD')\",
              \"export DB_SSL=true\",
              \"echo '${{ github.sha }}' > .current-deployment-tag\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' pull api jobs notify\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' up -d --remove-orphans api jobs notify\",
              \"sleep 15\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' ps\",
              \"curl --fail --silent --show-error http://localhost:3000/health\",
              \"echo\",
              \"echo 'Production deployment successful.'\",
              \"cp .current-deployment-tag .last-known-good-tag\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Wait for SSM
      # --------------------------------------------------------
      - name: Wait for deployment
        continue-on-error: true
        run: |
          aws ssm wait command-executed \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

      # --------------------------------------------------------
      # Get actual SSM result
      # --------------------------------------------------------
      - name: Get deployment result
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          echo "===== STDOUT ====="

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "===== STDERR ====="

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Production deployment failed."
            exit 1
          fi

  # ============================================================
  # 6. ROLLBACK
  # ============================================================
  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest

    needs: deploy-production

    if: ${{ always() && needs.deploy-production.result == 'failure' }}

    steps:

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # Rollback through SSM
      # --------------------------------------------------------
      - name: Rollback via AWS SSM
        id: rollback
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "BrightShip production rollback" \
            --parameters commands="[
              \"set -e\",
              \"cd /opt/brightship\",
              \"if [ ! -f .last-known-good-tag ]; then echo 'No last-known-good deployment tag found. Automatic rollback unavailable.'; exit 0; fi\",
              \"ROLLBACK_TAG=\\$(cat .last-known-good-tag)\",
              \"echo Rolling back to \\$ROLLBACK_TAG\",
              \"export IMAGE_TAG=\\$ROLLBACK_TAG\",
              \"SECRET_JSON=\\$(aws secretsmanager get-secret-value --secret-id '${{ env.SECRETS_ID }}' --query SecretString --output text)\",
              \"export DB_HOST=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.host // .DB_HOST')\",
              \"export DB_PORT=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.port // .DB_PORT // 5432')\",
              \"export DB_NAME=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.dbname // .DB_NAME')\",
              \"export DB_USER=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.username // .DB_USER')\",
              \"export DB_PASSWORD=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.password // .DB_PASSWORD')\",
              \"export DB_SSL=true\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' pull api jobs notify\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' up -d --remove-orphans api jobs notify\",
              \"sleep 15\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' ps\",
              \"curl --fail --silent --show-error http://localhost:3000/health\",
              \"echo\",
              \"echo 'Rollback completed successfully.'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Wait for rollback
      # --------------------------------------------------------
      - name: Wait for rollback
        continue-on-error: true
        run: |
          aws ssm wait command-executed \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.rollback.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

      # --------------------------------------------------------
      # Get rollback result
      # --------------------------------------------------------
      - name: Get rollback result
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.rollback.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Rollback status: $STATUS"

          echo "===== STDOUT ====="

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.rollback.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "===== STDERR ====="

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.rollback.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Rollback failed."
            exit 1
          fi

  # ============================================================
  # 7. SUMMARY
  # ============================================================
  summary:
    name: Production Deployment Summary
    runs-on: ubuntu-latest

    needs:
      - validate
      - ci-gate
      - docker-security
      - publish-images
      - deploy-production
      - rollback-production

    if: always()

    steps:
      - name: Deployment summary
        run: |
          echo "=========================================="
          echo " BrightShip Production Deployment"
          echo "=========================================="
          echo "Commit: ${{ github.sha }}"
          echo "API:    ghcr.io/${{ env.IMAGE_OWNER }}/brightship-api:${{ github.sha }}"
          echo "Jobs:   ghcr.io/${{ env.IMAGE_OWNER }}/brightship-jobs:${{ github.sha }}"
          echo "Notify: ghcr.io/${{ env.IMAGE_OWNER }}/brightship-notify:${{ github.sha }}"
          echo "=========================================="
          echo "Validate:        ${{ needs.validate.result }}"
          echo "CI Gate:         ${{ needs.ci-gate.result }}"
          echo "Security:        ${{ needs.docker-security.result }}"
          echo "Publish:         ${{ needs.publish-images.result }}"
          echo "Deployment:      ${{ needs.deploy-production.result }}"
          echo "Rollback:        ${{ needs.rollback-production.result }}"
          echo "=========================================="
