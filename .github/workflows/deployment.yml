name: BrightShip Production Deployment

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dreyshantel

  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0fdce62ef49bc9fa4
  IAM_ROLE_ARN: arn:aws:iam::928118644342:role/BrightShip-GitHub-Production-Deploy

  COMPOSE_PATH: /opt/brightship/compose-production.yml
  SECRETS_ID: rds!db-97b7c300-82ae-4e9c-ae7d-9f81383cad2d

jobs:

  # ============================================================
  # 1. VALIDATE MERGE
  # ============================================================

  validate:
    name: Validate Production Deployment
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment files
        run: |
          set -e

          test -f brightship/compose-production.yml

          test -d brightship/services/api
          test -d brightship/services/jobs
          test -d brightship/services/notify

          echo "Production deployment files validated."

  # ============================================================
  # 2. BUILD AND PUSH THREE SERVICES
  # ============================================================

  publish-images:
    name: Build and Push Production Images
    runs-on: ubuntu-latest

    needs: validate

    strategy:
      matrix:
        service:
          - api
          - jobs
          - notify

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # LOGIN TO GHCR
      # --------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # BUILD AND PUSH
      # --------------------------------------------------------

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: brightship/services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/brightship-${{ matrix.service }}:production

  # ============================================================
  # 3. DEPLOY TO PRODUCTION
  # ============================================================

  deploy-production:
    name: Deploy Three Services to Production
    runs-on: ubuntu-latest

    needs:
      - validate
      - publish-images

    environment: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # CONFIGURE AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # SEND COMPOSE FILE TO EC2
      # --------------------------------------------------------

      - name: Encode production compose file
        id: compose
        shell: bash
        run: |
          set -e

          COMPOSE_B64=$(base64 -w 0 brightship/compose-production.yml)

          echo "compose_b64=$COMPOSE_B64" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # DEPLOY THROUGH AWS SSM
      # --------------------------------------------------------

      - name: Deploy via AWS SSM
        id: deploy
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "BrightShip production deployment ${{ github.sha }}" \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /opt/brightship\",
              \"echo '${{ steps.compose.outputs.compose_b64 }}' | base64 -d > '${{ env.COMPOSE_PATH }}'\",
              \"cd /opt/brightship\",
              \"export IMAGE_TAG='${{ github.sha }}'\",
              \"echo 'Fetching production database credentials from AWS Secrets Manager...'\",
              \"SECRET_JSON=\\$(aws secretsmanager get-secret-value --secret-id '${{ env.SECRETS_ID }}' --query SecretString --output text)\",
              \"export DB_HOST=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.host // .DB_HOST // empty')\",
              \"export DB_PORT=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.port // .DB_PORT // 5432')\",
              \"export DB_NAME=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.dbname // .DB_NAME // empty')\",
              \"export DB_USER=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.username // .DB_USER // empty')\",
              \"export DB_PASSWORD=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.password // .DB_PASSWORD // empty')\",
              \"export DB_SSL=true\",
              \"test -n \\\"\\$DB_HOST\\\"\",
              \"test -n \\\"\\$DB_NAME\\\"\",
              \"test -n \\\"\\$DB_USER\\\"\",
              \"test -n \\\"\\$DB_PASSWORD\\\"\",
              \"echo 'Database configuration loaded successfully.'\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' pull api jobs notify\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' up -d --remove-orphans api jobs notify\",
              \"sleep 15\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' ps\",
              \"curl --fail --silent --show-error http://localhost:3000/health\",
              \"echo\",
              \"echo '${{ github.sha }}' > .current-deployment-tag\",
              \"cp .current-deployment-tag .last-known-good-tag\",
              \"unset DB_PASSWORD SECRET_JSON\",
              \"echo 'Production deployment successful.'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # WAIT FOR SSM COMMAND
      # --------------------------------------------------------

      - name: Wait for deployment
        continue-on-error: true
        run: |
          aws ssm wait command-executed \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

      # --------------------------------------------------------
      # CHECK DEPLOYMENT RESULT
      # --------------------------------------------------------

      - name: Get deployment result
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          echo "===== STDOUT ====="

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "===== STDERR ====="

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Production deployment failed."
            exit 1
          fi

  # ============================================================
  # 4. ROLLBACK
  # ============================================================

  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest

    needs: deploy-production

    if: failure()

    environment: production

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback via AWS SSM
        shell: bash
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "BrightShip production rollback" \
            --parameters commands="[
              \"set -e\",
              \"cd /opt/brightship\",
              \"if [ ! -f .last-known-good-tag ]; then echo 'No previous deployment tag found.'; exit 1; fi\",
              \"export IMAGE_TAG=\\$(cat .last-known-good-tag)\",
              \"echo 'Rolling back to: '\\$IMAGE_TAG\",
              \"SECRET_JSON=\\$(aws secretsmanager get-secret-value --secret-id '${{ env.SECRETS_ID }}' --query SecretString --output text)\",
              \"export DB_HOST=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.host // .DB_HOST // empty')\",
              \"export DB_PORT=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.port // .DB_PORT // 5432')\",
              \"export DB_NAME=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.dbname // .DB_NAME // empty')\",
              \"export DB_USER=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.username // .DB_USER // empty')\",
              \"export DB_PASSWORD=\\$(echo \\\"\\$SECRET_JSON\\\" | jq -r '.password // .DB_PASSWORD // empty')\",
              \"export DB_SSL=true\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' pull api jobs notify\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' up -d --remove-orphans api jobs notify\",
              \"sleep 15\",
              \"docker compose -f '${{ env.COMPOSE_PATH }}' ps\",
              \"curl --fail --silent --show-error http://localhost:3000/health\",
              \"unset DB_PASSWORD SECRET_JSON\",
              \"echo 'Rollback completed successfully.'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Rollback command: $COMMAND_ID"

          aws ssm wait command-executed \
            --region "${{ env.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Rollback status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Rollback failed."
            exit 1
          fi

  # ============================================================
  # 5. DEPLOYMENT SUMMARY
  # ============================================================

  summary:
    name: Production Deployment Summary
    runs-on: ubuntu-latest

    needs:
      - validate
      - publish-images
      - deploy-production

    if: always()

    steps:

      - name: Deployment summary
        run: |

          echo "================================================"
          echo "BrightShip Production Deployment"
          echo "================================================"
          echo "Commit:    ${{ github.sha }}"
          echo "Branch:    ${{ github.ref_name }}"
          echo "Services:  API, Jobs, Notify"
          echo "Registry:  GHCR"
          echo "Server:    ${{ env.EC2_INSTANCE_ID }}"
          echo "================================================"

          if [ "${{ needs.deploy-production.result }}" = "success" ]; then
            echo "STATUS: SUCCESS"
          else
            echo "STATUS: FAILED"
          fi

