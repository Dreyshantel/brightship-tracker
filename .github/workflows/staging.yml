name: Develop → Staging → Production

on:
  push:
    branches:
      - develop
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'feature/')
      )

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: brightship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d brightship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: brightship/package-lock.json

      - name: Install dependencies
        working-directory: brightship
        run: npm ci

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: testpassword
        run: |
          until pg_isready \
            -h 127.0.0.1 \
            -p 5432 \
            -U admin \
            -d brightship_test
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Initialize test database
        env:
          PGPASSWORD: testpassword
        run: |
          psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U admin \
            -d brightship_test \
            -f brightship/database/schema.sql

      - name: Run tests
        working-directory: brightship
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: testpassword
          DB_NAME: brightship_test
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./brightship
          push: true
          tags: ghcr.io/dreyshantel/brightship-tracker:${{ github.sha }}

      - name: Deploy staging to Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          echo "Reading staging Compose file from repository..."

          FILE=$(cat brightship/compose-staging.yml)

          if [ -z "$FILE" ]; then
            echo "Staging Compose file is empty."
            exit 1
          fi

          echo "Reading current Portainer stack environment..."

          STACK=$(curl --fail-with-body -ks \
            --connect-timeout 15 \
            --max-time 30 \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/1")

          ENVS=$(echo "$STACK" | jq '.Env')

          if [ "$ENVS" = "null" ]; then
            echo "Portainer stack environment could not be read."
            exit 1
          fi

          echo "Updating IMAGE_TAG..."

          ENVS=$(echo "$ENVS" | jq \
            --arg image_tag "$IMAGE_TAG" \
            'map(
              if .name == "IMAGE_TAG"
              then .value = $image_tag
              else .
              end
            )')

          PAYLOAD=$(jq -n \
            --arg file "$FILE" \
            --argjson env "$ENVS" \
            '{
              StackFileContent: $file,
              Env: $env,
              Prune: false,
              RepullImageAndRedeploy: true
            }')

          echo "Updating Portainer staging stack..."

          curl --fail-with-body -ks \
            --connect-timeout 15 \
            --max-time 60 \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            "${PORTAINER_URL}/api/stacks/1?endpointId=3" \
            -d "$PAYLOAD"

          echo "Staging deployment completed successfully."

      - name: Staging smoke test
        run: |
          set -e

          curl --fail --silent --show-error \
            http://44.209.188.71:3001/health

          echo "Staging smoke test passed."

  deploy-production:
    name: Deploy to Production
    needs: build-test-push-deploy
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::928118644342:role/BrightShip-GitHub-Production-Deploy
          aws-region: us-east-1

      - name: Deploy production via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --region us-east-1 \
            --instance-ids i-0fdce62ef49bc9fa4 \
            --document-name AWS-RunShellScript \
            --parameters "commands=[
              \"set -e\",
              \"cd /home/ssm-user/brightship-production\",
              \"SECRET=\\$(aws secretsmanager get-secret-value --secret-id 'rds!db-97b7c300-82ae-4e9c-ae7d-9f81383cad2d' --region us-east-1 --query SecretString --output text)\",
              \"export DB_USER=\\$(echo \\\"\\$SECRET\\\" | jq -r .username)\",
              \"export DB_PASSWORD=\\$(echo \\\"\\$SECRET\\\" | jq -r .password)\",
              \"export DB_HOST=brightship-production-db.cojkosse0m3v.us-east-1.rds.amazonaws.com\",
              \"export DB_NAME=postgres\",
              \"export IMAGE_TAG='$IMAGE_TAG'\",
              \"docker compose -f compose-production.yml pull\",
              \"docker compose -f compose-production.yml up -d\",
              \"unset DB_USER DB_PASSWORD SECRET\",
              \"echo Production deployment completed\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --region us-east-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0fdce62ef49bc9fa4 \
              --query 'Status' \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Production deployment failed."
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Production deployment timed out."
          exit 1

      - name: Production smoke test
        run: |
          set -e

          curl --fail --silent --show-error \
            http://44.209.188.71:3000/health

          echo "Production smoke test passed."