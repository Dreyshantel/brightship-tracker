name: Develop → Staging

on:
  push:
    branches:
      - develop
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'feature/')
      )

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: brightship_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d brightship_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: brightship/package-lock.json

      - name: Install dependencies
        working-directory: brightship
        run: npm ci

      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: testpassword
        run: |
          until pg_isready \
            -h 127.0.0.1 \
            -p 5432 \
            -U admin \
            -d brightship_test
          do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Initialize test database
        env:
          PGPASSWORD: testpassword
        run: |
          psql \
            -h 127.0.0.1 \
            -p 5432 \
            -U admin \
            -d brightship_test \
            -f brightship/database/schema.sql

      - name: Run tests
        working-directory: brightship
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: admin
          DB_PASSWORD: testpassword
          DB_NAME: brightship_test
        run: npm test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./brightship
          push: true
          tags: ghcr.io/dreyshantel/brightship-tracker:${{ github.sha }}

      - name: Deploy staging to Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          echo "Reading current Portainer stack..."

          STACK=$(curl --fail-with-body -ks \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/1")

          FILE=$(curl --fail-with-body -ks \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/1/file" \
            | jq -r '.StackFileContent')

          if [ -z "$FILE" ] || [ "$FILE" = "null" ]; then
            echo "Failed to retrieve Portainer stack file."
            exit 1
          fi

          ENVS=$(echo "$STACK" | jq '.Env')

          echo "Updating IMAGE_TAG..."

          ENVS=$(echo "$ENVS" | jq \
            --arg image_tag "$IMAGE_TAG" \
            'map(
              if .name == "IMAGE_TAG"
              then .value = $image_tag
              else .
              end
            )')

          PAYLOAD=$(jq -n \
            --arg file "$FILE" \
            --argjson env "$ENVS" \
            '{
              StackFileContent: $file,
              Env: $env,
              Prune: false,
              RepullImageAndRedeploy: true
            }')

          echo "Updating Portainer staging stack..."

          curl --fail-with-body -ks \
            -X PUT \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            "${PORTAINER_URL}/api/stacks/1?endpointId=3" \
            -d "$PAYLOAD"

          echo "Staging deployment completed successfully."