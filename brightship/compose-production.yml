services:

  api:
    image: "ghcr.io/dreyshantel/brightship-api:${IMAGE_TAG}"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"

      DB_HOST: "${DB_HOST}"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSL: "true"

      APP_VERSION: "${IMAGE_TAG}"
    restart: unless-stopped

  jobs:
    image: "ghcr.io/dreyshantel/brightship-jobs:${IMAGE_TAG}"
    environment:
      NODE_ENV: "production"

      DB_HOST: "${DB_HOST}"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSL: "true"

      APP_VERSION: "${IMAGE_TAG}"
    restart: unless-stopped

  notify:
    image: "ghcr.io/dreyshantel/brightship-notify:${IMAGE_TAG}"
    environment:
      NODE_ENV: "production"

      DB_HOST: "${DB_HOST}"
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_SSL: "true"

      APP_VERSION: "${IMAGE_TAG}"
    restart: unless-stopped


