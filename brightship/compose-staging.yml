services:
  app:
    image: "ghcr.io/dreyshantel/brightship-tracker:${IMAGE_TAG}"
    ports:
      - "3001:3000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: brightship
      DB_USER: admin
      DB_PASSWORD: "${DB_PASSWORD}"
      STRIPE_KEY: "${STRIPE_KEY}"
      APP_VERSION: "${IMAGE_TAG}"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: brightship
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
    external: true
    name: brightship_pgdata
