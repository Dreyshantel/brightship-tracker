apiVersion: apps/v1
kind: Deployment
metadata:
  name: brightship-notify
  namespace: brightship
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brightship-notify
  template:
    metadata:
      labels:
        app: brightship-notify
    spec:
      containers:
        - name: brightship-notify
          image: ghcr.io/dreyshantel/brightship-notify:production
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: brightship-notify-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
